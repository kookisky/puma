<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171529" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310152d'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-size='48' fill='%23ff73ac'%3E♥%3C/text%3E%3C/svg%3E" />
    <meta name="description" content="綠色小英雄，愛心全開！" />
    <title>甘蔗風暴 · PUMA</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #171529; }
      body { overscroll-behavior: none; touch-action: none; }
      #game { width: 100%; height: 100%; height: 100dvh; touch-action: none; }
      @media (pointer: coarse) {
        #game { height: calc(100dvh - max(40px, env(safe-area-inset-bottom))); }
      }
      canvas { display: block; image-rendering: auto; touch-action: none; }
      #startup { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; color: #ffe9bd; font: 16px sans-serif; background: #10152d; z-index: 120; }
      #startup .heart { color: #ff73ac; font-size: 48px; }
      #startup button { padding: 12px 24px; border: 1px solid #62e2cb; border-radius: 8px; background: #19223d; color: #fff0d4; font: inherit; }
    </style>
    
  </head>
  <body>
    <main id="game" aria-label="甘蔗風暴遊戲"></main>
    <div id="startup">
      <div class="heart" aria-hidden="true">♥</div>
      <div id="startup-status" role="status">愛心集氣中 · 正在連線</div>
      <button id="startup-retry" type="button" hidden>重新連線</button>
    </div>
    <script>
      (() => {
        const shell = document.getElementById('startup');
        const status = document.getElementById('startup-status');
        const retry = document.getElementById('startup-retry');
        let recovering = false;
        let stage = 'download';
        const showRecovery = (reason = 'timeout') => {
          recovering = true;
          shell.dataset.reason = reason;
          status.textContent = reason === 'runtime'
            ? '遊戲啟動需要重試，請點按重新連線'
            : '連線需要較長時間，可點按重新連線';
          retry.hidden = false;
        };
        const onError = event => {
          if (event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement) showRecovery('download');
          else if (event instanceof ErrorEvent) showRecovery('runtime');
        };
        const onRejection = () => showRecovery('runtime');
        const timer = window.setTimeout(() => showRecovery(stage), 15000);
        const reconnect = () => {
          const url = new URL(location.href);
          url.searchParams.set('startupRetry', String(Date.now()));
          location.replace(url.href);
        };
        retry.onclick = reconnect;
        const onOnline = () => { if (recovering) reconnect(); };
        window.addEventListener('online', onOnline);
        window.addEventListener('error', onError, true);
        window.addEventListener('unhandledrejection', onRejection);
        // Production uses one self-contained module. Its URL changes with the
        // page retry so every module dependency receives a fresh cache key.
        window.__pumaStart = entry => {
          const url = new URL(entry, location.href);
          const token = new URL(location.href).searchParams.get('startupRetry');
          if (token) url.searchParams.set('startupRetry', token);
          const script = document.createElement('script');
          script.type = 'module';
          script.src = url.href;
          script.onerror = () => showRecovery('download');
          script.onload = () => { stage = 'runtime'; };
          document.head.append(script);
        };
        window.addEventListener('puma-boot-ready', () => {
          window.clearTimeout(timer);
          window.removeEventListener('error', onError, true);
          window.removeEventListener('online', onOnline);
          window.removeEventListener('unhandledrejection', onRejection);
          delete window.__pumaStart;
          shell.remove();
        }, {once: true});
      })();
    </script>
  <script>window.__pumaStart("./assets/index-Ctr_9wNW.js");</script></body>
</html>
